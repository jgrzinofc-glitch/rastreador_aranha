<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreador Aranha — Painel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    --bg: #0A0E1A;
    --panel: #10152A;
    --line: #26315A;
    --text: #EDEFFA;
    --muted: #8590B8;
    --signal: #2E6BFF;
    --danger: #E4293D;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex;
    flex-direction:column;
  }
  header{
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap: 10px;
    background: linear-gradient(90deg, rgba(228,41,61,0.12), transparent 60%);
  }
  header h1{
    font-size: 18px;
    margin:0;
    font-weight:700;
  }
  header h1::before{
    content:"🕷️ ";
  }
  .badge{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 13px;
    color: var(--muted);
  }
  .dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--danger);
  }
  .dot.on{ background: var(--signal); }
  #map{ flex:1; min-height: 300px; }
  .stats{
    display:flex;
    gap: 14px;
    padding: 16px 20px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .tile{
    background: #0D1B25;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 130px;
    flex: 1;
  }
  .tile .label{ font-size:12px; color:var(--muted); margin-bottom:4px;}
  .tile .value{
    font-family: 'Consolas', 'SF Mono', monospace;
    font-size: 20px;
    font-weight: 600;
  }
</style>
</head>
<body>
<header>
  <h1>Rastreador Aranha — ao vivo</h1>
  <div class="badge"><span class="dot" id="dot"></span><span id="statusText">Sem dados ainda</span></div>
</header>

<div id="map"></div>

<div class="stats">
  <div class="tile">
    <div class="label">Passos</div>
    <div class="value" id="valPassos">—</div>
  </div>
  <div class="tile">
    <div class="label">Precisão do GPS</div>
    <div class="value" id="valPrecisao">—</div>
  </div>
  <div class="tile">
    <div class="label">Última atualização</div>
    <div class="value" id="valTempo">—</div>
  </div>
</div>

<script>
// ====== CONFIGURAÇÃO — cole aqui a mesma URL do Firebase usada em rastreador.html ======
const FIREBASE_URL = "https://rastreador-aranha-v1-default-rtdb.firebaseio.com"; // ex: "https://rastreador-ciencias-default-rtdb.firebaseio.com"
// =========================================================================================

const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const valPassos = document.getElementById('valPassos');
const valPrecisao = document.getElementById('valPrecisao');
const valTempo = document.getElementById('valTempo');

const map = L.map('map').setView([-15.79, -47.88], 15); // centro inicial: Brasília
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

let marker = null;
let circulo = null;
let jaCentralizou = false;

const iconeAranha = L.divIcon({
  className: 'icone-aranha',
  html: `<div style="
      width:42px; height:42px;
      background: radial-gradient(circle at 35% 30%, #241226, #000 70%);
      border: 2px solid #E4293D;
      border-radius: 50%;
      display:flex; align-items:center; justify-content:center;
      font-size: 22px;
      box-shadow: 0 0 4px 2px rgba(46,107,255,0.7), 0 0 14px rgba(228,41,61,0.7);
    ">🕷️</div>`,
  iconSize: [42, 42],
  iconAnchor: [21, 21]
});

async function atualizar(){
  if (!FIREBASE_URL || FIREBASE_URL.includes('SUBSTITUA_AQUI')){
    statusText.textContent = 'Configure a URL do Firebase no arquivo mapa.html';
    return;
  }
  try{
    const resp = await fetch(FIREBASE_URL + '/rastreador.json');
    const dados = await resp.json();
    if (!dados){
      statusText.textContent = 'Nenhum dado recebido ainda';
      return;
    }

    const { lat, lon, passos, precisao, timestamp } = dados;
    const segundosAtras = (Date.now() - timestamp) / 1000;
    const online = segundosAtras < 30;

    dot.classList.toggle('on', online);
    statusText.textContent = online ? 'Ao vivo' : 'Sinal perdido há ' + Math.round(segundosAtras) + 's';
    valPassos.textContent = passos ?? '—';
    valPrecisao.textContent = precisao ? precisao + ' m' : '—';
    valTempo.textContent = new Date(timestamp).toLocaleTimeString();

    if (lat && lon){
      if (!marker){
        marker = L.marker([lat, lon], { icon: iconeAranha }).addTo(map);
        circulo = L.circle([lat, lon], { radius: precisao || 10, color:'#2E6BFF', fillOpacity:0.12 }).addTo(map);
      } else {
        marker.setLatLng([lat, lon]);
        circulo.setLatLng([lat, lon]);
        circulo.setRadius(precisao || 10);
      }
      if (!jaCentralizou){
        map.setView([lat, lon], 17);
        jaCentralizou = true;
      }
    }
  }catch(err){
    statusText.textContent = 'Erro ao buscar dados: verifique a URL do Firebase';
  }
}

atualizar();
setInterval(atualizar, 3000);
</script>
</body>
</html>
